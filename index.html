<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="referrer" content="no-referrer">
  <title>ianimandoShop | Facilitando o Dia a Dia</title>
  
  <!-- FAVICON / ÍCONE DE CIMA -->
  <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dmmohbsc5/image/upload/v1786974066/Gemini_Generated_Image_smyn1ksmyn1ksmyn_sg5iqb.jpg">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #000000;
      --accent-hover: #374151;
      --radius: 16px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --transition: all 0.2s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    button { border: none; background: none; cursor: pointer; font-family: inherit; }
    img { max-width: 100%; height: auto; display: block; }
    ul { list-style: none; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.25rem; }
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      padding: 1rem 0;
    }
    .header-content { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.025em; cursor: pointer; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links button { font-size: 0.875rem; font-weight: 500; color: var(--muted); transition: var(--transition); }
    .nav-links button:hover, .nav-links button.active { color: var(--text); }
    .mobile-menu-btn { display: none; font-size: 1.5rem; }

    .hero {
      text-align: center;
      padding: 6rem 1rem;
      background: var(--surface);
      border-radius: var(--radius);
      margin: 2rem 0;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .hero h1 { 
      font-size: 3rem; 
      font-weight: 800; 
      margin-bottom: 1rem; 
      letter-spacing: -0.025em; 
      line-height: 1.1; 
      position: relative;
      z-index: 2;
    }
    
    /* SAPO AUMENTADO EM 2 VEZES E COM TRANSPARÊNCIA MANTIDA */
    .hero-frog-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1900px;
      max-width: none;
      opacity: 0.1;
      pointer-events: none;
      z-index: 0;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
    }
    .hero-frog-bg img {
      width: 100%;
      height: auto;
      display: block;
    }

    .hero p { 
      font-size: 1.125rem; 
      color: var(--muted); 
      max-width: 600px; 
      margin: 0 auto 2rem; 
      position: relative;
      z-index: 2;
    }
    
    .btn-primary {
      background: var(--accent); color: white; padding: 0.875rem 1.5rem;
      border-radius: 999px; font-weight: 600; font-size: 0.875rem;
      transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      position: relative;
      z-index: 2;
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 0.875rem 1.5rem; border-radius: 999px; font-weight: 600; font-size: 0.875rem;
      transition: var(--transition);
      position: relative;
      z-index: 2;
    }
    .btn-secondary:hover { border-color: var(--muted); background: var(--bg); }
    
    .btn-platform {
      color: white; padding: 0.6rem 1.5rem;
      border-radius: 8px; font-weight: 600; font-size: 0.85rem; width: max-content; min-width: 110px; height: 40px;
      transition: var(--transition); display: inline-flex; justify-content: center; align-items: center; gap: 0.4rem;
      margin-top: 1rem; text-decoration: none;
    }
    .btn-platform:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.15); filter: brightness(0.9); }
    .btn-platform:disabled { opacity: 0.85; cursor: wait; }

    .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: flex-end; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    
    .product-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; transition: var(--transition); display: flex; flex-direction: column;
      cursor: pointer; position: relative;
    }
    .product-card:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); }
    .product-image-container { aspect-ratio: 1 / 1; background: #f3f4f6; position: relative; overflow: hidden; }
    .product-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .product-card:hover .product-image { transform: scale(1.05); }
    
    .badge {
      position: absolute; top: 1rem; left: 1rem; background: var(--surface); color: var(--text);
      padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; box-shadow: var(--shadow-sm); z-index: 10;
    }
    
    .product-info { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .product-category { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    .product-name { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.4; color: var(--text); }
    .product-price-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; }
    .price { font-size: 1.25rem; font-weight: 800; display: block; }
    .old-price { font-size: 0.875rem; color: var(--muted); text-decoration: line-through; margin-left: 6px; }
    .view-deal-container { display: flex; align-items: center; gap: 6px; }
    .view-deal-text { font-size: 0.75rem; font-weight: 600; color: var(--accent); }

    .search-bar {
      width: 100%; padding: 1.25rem 1.5rem; border-radius: var(--radius); border: 1px solid var(--border);
      font-size: 1rem; margin-bottom: 2rem; outline: none; background: var(--surface); box-shadow: var(--shadow-sm);
    }
    .search-bar:focus { border-color: var(--accent); }
    
    .category-pill-container { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 1rem; }
    .category-pill-container::-webkit-scrollbar { display: none; }
    .category-pill {
      padding: 0.5rem 1.25rem; border-radius: 999px; font-size: 0.875rem; font-weight: 600;
      white-space: nowrap; transition: var(--transition); border: 1px solid var(--border);
    }
    .category-pill.active { background: var(--accent); color: white; border-color: var(--accent); }
    .category-pill:not(.active):hover { border-color: var(--muted); }

    .segment-control {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      width: max-content;
    }
    .segment-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
      transition: var(--transition);
    }
    .segment-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .segment-btn:not(.active):hover { color: var(--text); }

    .product-page { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; padding: 2rem 0; }
    
    .gallery-wrapper { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding-bottom: 1rem; }
    .carousel-container { 
      position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; border-radius: var(--radius) var(--radius) 0 0;
      touch-action: pan-y;
      background: #000;
    }
    
    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .carousel-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }
    .carousel-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: auto;
    }

    .modern-video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .modern-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease;
    }
    .play-button-circle {
      width: 68px;
      height: 68px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.2s ease, background 0.2s ease;
      padding-left: 4px;
    }
    .modern-video-wrapper:hover .play-button-circle {
      transform: scale(1.1);
      background: #ffffff;
    }

    .carousel-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.9); border: none; width: 40px; height: 40px;
      border-radius: 50%; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: var(--shadow-md); transition: var(--transition); z-index: 2; color: var(--text);
    }
    .carousel-arrow:hover { background: white; transform: translateY(-50%) scale(1.05); }
    .carousel-arrow.left { left: 16px; }
    .carousel-arrow.right { right: 16px; }
    .image-counter { text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--text); margin-top: 1rem; letter-spacing: 0.05em; }

    .product-details h1 { font-size: 2.0rem; font-weight: 800; margin: 0.5rem 0 0.5rem; line-height: 1.2; }
    .product-seller { font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem; font-weight: 500; }
    .product-seller span { color: var(--text); font-weight: 700; }
    
    .promo-app-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .promo-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .product-description { color: var(--muted); font-size: 1rem; margin-bottom: 2rem; }
    
    .benefits-list { margin-bottom: 2rem; background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); }
    .benefits-list h3 { font-size: 0.875rem; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .benefits-list li { margin-bottom: 0.75rem; display: flex; align-items: flex-start; gap: 0.75rem; font-size: 0.875rem; color: var(--muted); }
    .benefits-list li svg { flex-shrink: 0; width: 18px; height: 18px; color: var(--accent); }

    .platform-branding {
      display: flex; align-items: center; gap: 1rem; background: #111827; color: white;
      padding: 1rem 1.25rem; border-radius: 12px; margin-bottom: 0.5rem;
    }
    .platform-icon-wrapper { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .platform-branding p { font-size: 0.875rem; font-weight: 700; margin: 0; }
    .platform-branding span { display: block; font-size: 0.75rem; color: #9ca3af; }

    .static-page { max-width: 800px; margin: 0 auto; padding: 3rem 0; background: var(--surface); padding: 3rem; border-radius: var(--radius); border: 1px solid var(--border); margin-top: 2rem; }
    .static-page h1 { font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem; }
    .static-page p { color: var(--muted); margin-bottom: 1rem; line-height: 1.7; }

    .footer { background: var(--surface); border-top: 1px solid var(--border); padding: 4rem 0 2rem; margin-top: 4rem; }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 2rem; margin-bottom: 3rem; }
    .footer-title { font-weight: 700; margin-bottom: 1.25rem; font-size: 1rem; }
    .footer-links li { margin-bottom: 0.75rem; }
    .footer-links button { color: var(--muted); font-size: 0.875rem; transition: var(--transition); }
    .footer-links button:hover { color: var(--text); }
    .disclaimer { font-size: 0.75rem; color: var(--muted); text-align: center; padding-top: 2rem; border-top: 1px solid var(--border); line-height: 1.6; }

    .bottom-nav { display: none; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero { padding: 4rem 1rem; }
      .hero h1 { font-size: 2.25rem; }
      .product-page { grid-template-columns: 1fr; gap: 2rem; padding: 1rem 0; }
      .footer-grid { grid-template-columns: 1fr; gap: 2rem; }
      .static-page { padding: 1.5rem; }
      .main-wrapper { padding-bottom: 90px; }
      .segment-control { display: flex; width: 100%; justify-content: space-between; }
      .segment-btn { flex: 1; text-align: center; padding: 0.5rem; }
      .carousel-arrow { display: none; }
      
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
      .product-info { padding: 0.5rem; }
      .product-name { font-size: 0.85rem; margin-bottom: 0.5rem; }
      .price { font-size: 1rem; }
      .old-price { font-size: 0.75rem; margin-left: 4px; }
      .view-deal-text { display: none; }
      
      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border-top: 1px solid var(--border);
        z-index: 100;
        justify-content: space-around;
        align-items: center;
        padding: 0.5rem 0.5rem calc(0.5rem + env(safe-area-inset-bottom));
      }
      .bottom-nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        color: var(--muted);
        transition: var(--transition);
        flex: 1;
      }
      .nav-icon-bg {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
      }
      .bottom-nav-btn.active .nav-icon-bg {
        background: var(--accent);
        color: white;
      }
      .bottom-nav-btn.active { color: var(--text); }
      .bottom-nav-btn span { font-size: 0.65rem; font-weight: 600; margin-top: -2px; }
      .bottom-nav-btn svg { width: 20px; height: 20px; }
    }
  </style>
</head>

        subCategory: "",
        seller: "",
        price: 0.00,
        oldPrice: null,
        image: "",
        images: [],
        description: "",
        benefits: [],
        featured: false,
        trending: false,
        appPromotion: false,
        platform: "tiktok",
        affiliateUrl: "YOUR_AFFILIATE_LINK_HERE"
      },
      {
        id: "19",
        name: "",
        category: "",
        subCategory: "",
        seller: "",
        price: 0.00,
        oldPrice: null,
        image: "",
        images: [],
        description: "",
        benefits: [],
        featured: false,
        trending: false,
        appPromotion: false,
        platform: "tiktok",
        affiliateUrl: "YOUR_AFFILIATE_LINK_HERE"
      },
      {
        id: "20",
        name: "",
        category: "",
        subCategory: "",
        seller: "",
        price: 0.00,
        oldPrice: null,
        image: "",
        images: [],
        description: "",
        benefits: [],
        featured: false,
        trending: false,
        appPromotion: false,
        platform: "tiktok",
        affiliateUrl: "YOUR_AFFILIATE_LINK_HERE"
      }
    ];

    const CATEGORIES = ["Todos", "Moda", "Tecnologia", "Casa", "Beleza", "Fitness", "Estilo de Vida", "Acessórios"];

    const getPlatformBrand = (platform) => {
      switch(platform) {
        case 'shopee': return { name: 'Shopee', color: '#ee4d2d', Icon: ShopeeIcon };
        case 'hotmart': return { name: 'Hotmart', color: '#f04e23', Icon: HotmartIcon };
        default: return { name: 'TikTok Shop', color: '#fe2c55', Icon: TikTokIcon };
      }
    };

    const isVideoUrl = (url) => {
      if (!url) return false;
      return url.includes('.mp4') || url.includes('video_mp4') || url.includes('/video/');
    };

    const ModernVideoPlayer = ({ src }) => {
      const videoRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);

      const togglePlay = (e) => {
        e.stopPropagation();
        if (videoRef.current) {
          if (isPlaying) {
            videoRef.current.pause();
          } else {
            videoRef.current.play();
          }
          setIsPlaying(!isPlaying);
        }
      };

      return (
        <div className="modern-video-wrapper" onClick={togglePlay}>
          <video 
            ref={videoRef}
            src={src} 
            playsInline 
            controls
            className="carousel-video"
            onPlay={() => setIsPlaying(true)}
            onPause={() => setIsPlaying(false)}
          />
          {!isPlaying && (
            <div className="modern-play-overlay">
              <div className="play-button-circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </div>
            </div>
          )}
        </div>
      );
    };

    const ProductCard = ({ product, navigate }) => {
      if (!product.name) return null;
      const brand = getPlatformBrand(product.platform);
      
      return (
        <div className="product-card" onClick={() => navigate('product', product.id)}>
          <div className="product-image-container">
            <img src={product.image} alt={product.name} className="product-image" loading="lazy" />
            {product.trending && <span className="badge">Em Alta</span>}
            {!product.trending && product.featured && <span className="badge" style={{ background: '#f3f4f6', color: '#111827' }}>Destaque</span>}
          </div>
          <div className="product-info">
            <div>
              <span className="product-category">{product.category} {product.subCategory ? `• ${product.subCategory}` : ''}</span>
              <h3 className="product-name">{product.name}</h3>
            </div>
            <div className="product-price-row">
              <div>
                <span className="price">R$ {product.price.toFixed(2).replace('.', ',')}</span>
                {product.oldPrice && <span className="old-price">R$ {product.oldPrice.toFixed(2).replace('.', ',')}</span>}
              </div>
              <div className="view-deal-container">
                <brand.Icon className="w-4 h-4" style={{ color: brand.color }} />
                <span className="view-deal-text">Ver Oferta &rarr;</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Home = ({ navigate }) => {
      const trending = PRODUCTS.filter(p => p.trending && p.name).slice(0, 4);
      const featured = PRODUCTS.filter(p => p.featured && p.name).slice(0, 4);

      return (
        <div className="container fade-in">
          <section className="hero">
            <div className="hero-frog-bg">
              <img src="https://res.cloudinary.com/dmmohbsc5/image/upload/v1786974609/Gemini_Generated_Image_smyn1ksmyn1ksmyn-removebg-preview_m7pfgm.png" alt="Sapo ianimandoShop" />
            </div>
            <h1>ianimandoShop.<br/>Facilitando o Dia a Dia.</h1>
            <p>Descubra produtos úteis, interessantes e em alta selecionados para facilitar a sua rotina.</p>
            <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center', flexWrap: 'wrap' }}>
              <button className="btn-primary" onClick={() => navigate('shop')}>Explorar Produtos</button>
              <button className="btn-secondary" onClick={() => navigate('categories')}>Ver Categorias</button>
            </div>
          </section>

          <section>
            <div className="section-title">
              <h2>Em Alta Agora</h2>
              <button onClick={() => navigate('shop')} style={{ fontSize: '0.875rem', fontWeight: 600 }}>Ver Tudo &rarr;</button>
            </div>
            <div className="product-grid">
              {trending.map(product => <ProductCard key={product.id} product={product} navigate={navigate} />)}
            </div>
          </section>

          <section>
            <div className="section-title"><h2>Escolhas do Editor</h2></div>
            <div className="product-grid">
              {featured.map(product => <ProductCard key={product.id} product={product} navigate={navigate} />)}
            </div>
          </section>
        </div>
      );
    };

    const Shop = ({ navigate, initialCategory = 'Todos' }) => {
      const [search, setSearch] = useState('');
      const [cat, setCat] = useState(initialCategory);
      const [subCat, setSubCat] = useState('Todos');

      useEffect(() => {
        setCat(initialCategory);
      }, [initialCategory]);

      const handleCategoryChange = (newCat) => {
        setCat(newCat);
        setSubCat('Todos'); 
      };

      const filtered = PRODUCTS.filter(p => {
        if (!p.name) return false;
        const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.category.toLowerCase().includes(search.toLowerCase());
        const matchCat = cat === 'Todos' || p.category === cat;
        const matchSubCat = (cat === 'Moda' && subCat !== 'Todos') ? p.subCategory === subCat : true;
        
        return matchSearch && matchCat && matchSubCat;
      });

      return (
        <div className="container fade-in" style={{ paddingTop: '2rem' }}>
          <h1 className="section-title" style={{ fontSize: '2.5rem', marginBottom: '1.5rem' }}>Todos os Produtos</h1>
          
          <input 
            type="text" 
            placeholder="Buscar produtos..." 
            className="search-bar"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />

          <div className="category-pill-container" style={{ marginBottom: cat === 'Moda' ? '0' : '1.5rem' }}>
            {CATEGORIES.map(c => (
              <button 
                key={c} 
                className={`category-pill ${cat === c ? 'active' : ''}`}
                onClick={() => handleCategoryChange(c)}
              >
                {c}
              </button>
            ))}
          </div>

          {cat === 'Moda' && (
            <div className="fade-in">
              <div className="segment-control">
                <button 
                  className={`segment-btn ${subCat === 'Todos' ? 'active' : ''}`}
                  onClick={() => setSubCat('Todos')}
                >
                  Tudo
                </button>
                <button 
                  className={`segment-btn ${subCat === 'Masculino' ? 'active' : ''}`}
                  onClick={() => setSubCat('Masculino')}
                >
                  Masculino
                </button>
                <button 
                  className={`segment-btn ${subCat === 'Feminino' ? 'active' : ''}`}
                  onClick={() => setSubCat('Feminino')}
                >
                  Feminino
                </button>
              </div>
            </div>
          )}

          {filtered.length > 0 ? (
            <div className="product-grid">
              {filtered.map(product => <ProductCard key={product.id} product={product} navigate={navigate} />)}
            </div>
          ) : (
            <div style={{ textAlign: 'center', padding: '4rem 0' }}>
              <p style={{ color: 'var(--muted)', marginBottom: '1rem' }}>Nenhum produto encontrado.</p>
              <button className="btn-secondary" onClick={() => { setSearch(''); handleCategoryChange('Todos'); }}>Limpar Filtros</button>
            </div>
          )}
        </div>
      );
    };

    const ProductDetail = ({ id, navigate }) => {
      const product = PRODUCTS.find(p => p.id === id);
      const [isRedirecting, setIsRedirecting] = useState(false);
      
      const [currentImgIndex, setCurrentImgIndex] = useState(0);
      const [touchStart, setTouchStart] = useState(0);
      const [touchEnd, setTouchEnd] = useState(0);

      useEffect(() => { setCurrentImgIndex(0); }, [id]);

      if (!product || !product.name) return (
        <div className="container fade-in" style={{ textAlign: 'center', padding: '6rem 0' }}>
          <h2>Produto não encontrado</h2>
          <button className="btn-primary" onClick={() => navigate('shop')} style={{ marginTop: '1rem' }}>Voltar para a Loja</button>
        </div>
      );

      const brand = getPlatformBrand(product.platform);
      const galleryImages = product.images && product.images.length > 0 ? product.images : [product.image];

      const nextImage = () => setCurrentImgIndex(prev => (prev + 1) % galleryImages.length);
      const prevImage = () => setCurrentImgIndex(prev => (prev - 1 + galleryImages.length) % galleryImages.length);

      const handleTouchStart = (e) => setTouchStart(e.targetTouches[0].clientX);
      const handleTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);
      const handleTouchEnd = () => {
        if (!touchStart || !touchEnd) return;
        const distance = touchStart - touchEnd;
        if (distance > 50) nextImage();
        if (distance < -50) prevImage();
        setTouchStart(0);
        setTouchEnd(0);
      };

      const handleAcquireClick = () => {
        setIsRedirecting(true);
        setTimeout(() => {
          window.open(product.affiliateUrl, '_blank');
          setIsRedirecting(false);
        }, 1200);
      };

      return (
        <div className="container fade-in product-page">
          
          <div className="gallery-wrapper">
            <div 
              className="carousel-container"
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              <div 
                className="carousel-track" 
                style={{ transform: `translateX(-${currentImgIndex * 100}%)` }}
              >
                {galleryImages.map((mediaSrc, idx) => (
                  <div className="carousel-slide" key={idx}>
                    {isVideoUrl(mediaSrc) ? (
                      <ModernVideoPlayer src={mediaSrc} />
                    ) : (
                      <img src={mediaSrc} alt={product.name} className="carousel-image" />
                    )}
                  </div>
                ))}
              </div>
              
              {galleryImages.length > 1 && (
                <>
                  <button className="carousel-arrow left" onClick={prevImage}>&#10094;</button>
                  <button className="carousel-arrow right" onClick={nextImage}>&#10095;</button>
                </>
              )}
            </div>
            
            {galleryImages.length > 1 && (
              <div className="image-counter">
                {currentImgIndex + 1} / {galleryImages.length}
              </div>
            )}
          </div>

          <div className="product-details">
            <span style={{ fontSize: '0.875rem', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
              {product.category} {product.subCategory ? `• ${product.subCategory}` : ''}
            </span>
            <h1>{product.name}</h1>
            <div className="product-seller">
              Vendido por: <span>{product.seller || "Parceiro Oficial"}</span>
            </div>

            {product.appPromotion && (
              <div className="promo-app-badge">
                <span className="promo-dot"></span>
                Produto com possível promoção no App
              </div>
            )}
            
            <div className="product-price-row" style={{ justifyContent: 'flex-start', marginBottom: '1.5rem', gap: '1rem' }}>
              <span className="price" style={{ fontSize: '2.25rem' }}>R$ {product.price.toFixed(2).replace('.', ',')}</span>
              {product.oldPrice && <span className="old-price" style={{ fontSize: '1.25rem' }}>R$ {product.oldPrice.toFixed(2).replace('.', ',')}</span>}
            </div>
            
            <p className="product-description">{product.description}</p>
            
            <div className="benefits-list">
              <h3>Por que gostamos</h3>
              <ul>
                {product.benefits.map((benefit, index) => (
                  <li key={index}><CheckIcon /> <span>{benefit}</span></li>
                ))}
              </ul>
            </div>

            <div className="platform-branding">
              <div className="platform-icon-wrapper" style={{ backgroundColor: brand.color }}>
                <brand.Icon style={{ color: '#fff', width: '20px', height: '20px' }} />
              </div>
              <div>
                <p>Oficial {brand.name}</p>
                <span>Compra segura e protegida via plataforma</span>
              </div>
            </div>

            <button 
              onClick={handleAcquireClick}
              disabled={isRedirecting}
              className="btn-platform"
              style={{ backgroundColor: brand.color }}
            >
              {isRedirecting ? <div className="spinner"></div> : "Adquirir"}
            </button>
          </div>
        </div>
      );
    };

    const Categories = ({ navigate }) => (
      <div className="container fade-in" style={{ paddingTop: '2rem', paddingBottom: '4rem' }}>
        <h1 className="section-title" style={{ fontSize: '2.5rem' }}>Categorias</h1>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '1.5rem' }}>
          {CATEGORIES.filter(c => c !== 'Todos').map(cat => (
            <button 
              key={cat} 
              onClick={() => { navigate('shop', null, cat); }}
              style={{ background: 'var(--surface)', border: '1px solid var(--border)', padding: '3rem 1rem', borderRadius: 'var(--radius)', textAlign: 'center', fontWeight: 700, fontSize: '1.125rem', transition: 'var(--transition)' }}
              onMouseOver={e => e.currentTarget.style.borderColor = 'var(--accent)'}
              onMouseOut={e => e.currentTarget.style.borderColor = 'var(--border)'}
            >
              {cat}
            </button>
          ))}
        </div>
      </div>
    );

    const StaticPage = ({ title, content }) => (
      <div className="container fade-in">
        <div className="static-page">
          <h1>{title}</h1>
          <p>{content}</p>
          <p>Recomendações selecionadas e pensadas para tornar o seu dia a dia um pouco mais fácil, prático e interessante.</p>
        </div>
      </div>
    );

    const App = () => {
      const [view, setView] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('p');
        const pageId = params.get('page');
        const catId = params.get('cat');
        
        if (productId) return { page: 'product', id: productId, category: null };
        if (pageId) return { page: pageId, id: null, category: catId };
        return { page: 'home', id: null, category: null };
      });

      const navigate = (page, id = null, initialCategory = null) => {
        setView({ page, id, category: initialCategory });
        window.scrollTo({ top: 0, behavior: 'smooth' });

        let newUrl = window.location.pathname;
        if (id) {
          newUrl += `?p=${id}`;
        } else if (initialCategory && initialCategory !== 'Todos') {
          newUrl += `?page=${page}&cat=${encodeURIComponent(initialCategory)}`;
        } else if (page !== 'home') {
          newUrl += `?page=${page}`;
        }
        window.history.pushState({}, '', newUrl);
      };

      React.useEffect(() => {
        const handlePopState = () => {
          const params = new URLSearchParams(window.location.search);
          const productId = params.get('p');
          const pageId = params.get('page');
          const catId = params.get('cat');
          if (productId) setView({ page: 'product', id: productId, category: null });
          else if (pageId) setView({ page: pageId, id: null, category: catId });
          else setView({ page: 'home', id: null, category: null });
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const renderView = () => {
        switch (view.page) {
          case 'home': return <Home navigate={navigate} />;
          case 'shop': return <Shop navigate={navigate} initialCategory={view.category || 'Todos'} />;
          case 'product': return <ProductDetail id={view.id} navigate={navigate} />;
          case 'categories': return <Categories navigate={navigate} />;
          case 'about': return <StaticPage title="Sobre Nós" content="Nós descobrimos produtos úteis, interessantes e em alta na internet." />;
          case 'contact': return <StaticPage title="Contato" content="Fale conosco através do email contato@ianimandoshop.com." />;
          case 'privacy': return <StaticPage title="Política de Privacidade" content="Nós respeitamos a sua privacidade e seus dados." />;
          case 'terms': return <StaticPage title="Termos de Uso" content="Estes são os termos de uso para a nossa vitrine de afiliados." />;
          case 'disclosure': return <StaticPage title="Aviso de Afiliado" content="Podemos ganhar uma comissão se você comprar através dos nossos links, sem custo extra para você." />;
          default: return <Home navigate={navigate} />;
        }
      };

      return (
        <div className="main-wrapper" style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
          
          <header className="header">
            <div className="container header-content">
              <div className="logo" onClick={() => navigate('home')}>ianimandoShop</div>
              <nav className="nav-links">
                <button className={view.page === 'home' ? 'active' : ''} onClick={() => navigate('home')}>Início</button>
                <button className={view.page === 'shop' ? 'active' : ''} onClick={() => navigate('shop')}>Loja</button>
                <button className={view.page === 'categories' ? 'active' : ''} onClick={() => navigate('categories')}>Categorias</button>
                <button className={view.page === 'about' ? 'active' : ''} onClick={() => navigate('about')}>Sobre</button>
              </nav>
            </div>
          </header>

          <main style={{ flex: 1 }}>
            {renderView()}
          </main>

          <footer className="footer">
            <div className="container">
              <div className="footer-grid">
                <div>
                  <h3 className="footer-title">ianimandoShop</h3>
                  <p style={{ color: 'var(--muted)', fontSize: '0.875rem', maxWidth: '300px' }}>
                    Descubra produtos úteis, interessantes e em alta selecionados para facilitar o seu dia a dia.
                  </p>
                </div>
                <div>
                  <h3 className="footer-title">Links Rápidos</h3>
                  <ul className="footer-links">
                    <li><button onClick={() => navigate('shop')}>Todos os Produtos</button></li>
                    <li><button onClick={() => navigate('categories')}>Categorias</button></li>
                    <li><button onClick={() => navigate('about')}>Sobre Nós</button></li>
                    <li><button onClick={() => navigate('contact')}>Contato</button></li>
                  </ul>
                </div>
                <div>
                  <h3 className="footer-title">Legal</h3>
                  <ul className="footer-links">
                    <li><button onClick={() => navigate('privacy')}>Política de Privacidade</button></li>
                    <li><button onClick={() => navigate('terms')}>Termos de Uso</button></li>
                    <li><button onClick={() => navigate('disclosure')}>Aviso de Afiliado</button></li>
                  </ul>
                </div>
              </div>
              <div className="disclaimer">
                Alguns links neste site são de afiliados. Se você comprar através deles, podemos ganhar uma comissão sem custo extra para você.
              </div>
            </div>
          </footer>

          <nav className="bottom-nav">
            <button className={`bottom-nav-btn ${view.page === 'home' ? 'active' : ''}`} onClick={() => navigate('home')}>
              <div className="nav-icon-bg">
                <HomeIcon />
              </div>
              <span>Início</span>
            </button>
            <button className={`bottom-nav-btn ${view.page === 'shop' ? 'active' : ''}`} onClick={() => navigate('shop')}>
              <div className="nav-icon-bg">
                <ShopIcon />
              </div>
              <span>Loja</span>
            </button>
            <button className={`bottom-nav-btn ${view.page === 'categories' ? 'active' : ''}`} onClick={() => navigate('categories')}>
              <div className="nav-icon-bg">
                <CategoryIcon />
              </div>
              <span>Categorias</span>
            </button>
            <button className={`bottom-nav-btn ${view.page === 'about' ? 'active' : ''}`} onClick={() => navigate('about')}>
              <div className="nav-icon-bg">
                <InfoIcon />
              </div>
              <span>Sobre</span>
            </button>
          </nav>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
